name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AiUsageBar.sln

      - name: Build
        run: dotnet build AiUsageBar.sln -c Release -p:Platform=x64 --no-restore
